owcases contemporary finishes and stainless steel appliances, and select homes also feature a private patio or balcony.\u003c/p\u003e \u003cp\u003eJust outside your door, our community amenities are designed to put your needs first. Enjoy a workout anytime in our 24-hour fitness center, host gatherings in the barbecue area, or relax on our indoor/outdoor rooftop deck and take in the views of the Seattle skyline. Our pet-friendly community also comes complete with a dog-run for exercising your four-legged friend.\u003c/p\u003e \u003cp\u003eVox is perfectly positioned to offer easy access to some of the best spots in Seattle. Enjoy a vibrant neighborhood filled with all the essentials. Trader Joe\u0026rsquo;s is only a few blocks away, as are tennis and basketball courts at Cal Anderson Park, and a variety of bars and restaurants are also nearby to grab a bite with friends. Commuting is convenient with many transit options plus quick access to I-5.\u003c/p\u003e \u003cp\u003eThe \u003ca class=\"text-amber\" rel=\"noopener noreferrer\" target=\"_blank\" href=\"https://www.seattle.gov/Documents/Departments/RentingInSeattle/languages/English/RentersHandbook_English.pdf\"\u003e\u003cem\u003eCity of Seattle Renter's Handbook\u003c/em\u003e (PDF)\u003c/a\u003e summarizes the rental regulations and outlines the obligations and responsibilities of both tenants and landlords. A paper copy is available from the Leasing Office upon request. This community does not accept reusable (portable) tenant screening reports.\u003c/p\u003e \u003cp\u003e\u003cem\u003ePrice reflected is base rent and does not include mandatory or optional fees. Detailed fee information and fee schedules can be found on the community's \u003ca class=\"text-amber\" href=\"https://www.essexapartmenthomes.com/apartments/seattle/vox/leasing-info\" target=\"_blank\"\u003eLeasing Info\u003c/a\u003e page on our Essex website.\u003c/em\u003e\u003c/p\u003e "])</script><script>self.__next_f.push([1,"4f:T8c4,"])</scrip
