# One-click hosting for PodBrief on Render: https://render.com/deploy?repo=https://github.com/Orion0900/Claude-orion
# Free plan: the container sleeps when idle and its disk resets on deploy, but
# finished summaries are also kept on the phone, so nothing you've read is lost.
services:
  - type: web
    name: podbrief
    runtime: docker
    rootDir: podcast-summarizer
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5
      - key: DATA_DIR
        value: /data
