name: Vox watch

on:
  push:
    branches: [claude/vox-watch]
    paths: ['vox-watch/**', '.github/workflows/vox-watch.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vox-watch
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vox-watch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vox-watch/package-lock.json

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Firefox for Playwright
        run: npx playwright install --with-deps firefox

      - name: Explore the Vox pages
        continue-on-error: true
        run: xvfb-run -a node explore.mjs out

      - name: Building footprint and streets from OpenStreetMap
        continue-on-error: true
        run: node geo.mjs out

      - name: Archived copies of the pages
        continue-on-error: true
        run: node wayback.mjs out

      - name: Publish what was captured
        if: always()
        run: |
          cd out
          git init -q -b vox-watch-explore
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Explore run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vox-watch-explore
