name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the Pages deployment needs; nothing is granted beyond them.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # EasyPedal ships from the same site, one folder down, so both apps
      # deploy from a single push with nothing to configure.
      - name: Build EasyPedal
        working-directory: easypedal
        run: |
          npm ci
          npm test
          npm run build
      - name: Add EasyPedal to the site
        run: |
          mkdir -p dist/easypedal
          cp -r easypedal/dist/. dist/easypedal/

      - name: Build CaddieIQ
        working-directory: caddie
        run: |
          npm ci
          npm test
          npm run build
      - name: Add CaddieIQ to the site
        run: |
          mkdir -p dist/caddie
          cp -r caddie/dist/. dist/caddie/

      - name: Build Bonkrush
        working-directory: bonkrush
        run: |
          npm ci
          npm test
          npm run build
      - name: Add Bonkrush to the site
        run: |
          mkdir -p dist/bonkrush
          cp -r bonkrush/dist/. dist/bonkrush/

      - name: Build Tidebound
        working-directory: tidebound
        run: |
          npm ci
          npm test
          npm run build
      - name: Add Tidebound to the site
        run: |
          mkdir -p dist/tidebound
          cp -r tidebound/dist/. dist/tidebound/

      - name: Build Fretfire
        working-directory: fretfire
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm test
          npm run build
      - name: Add Fretfire to the site
        run: |
          mkdir -p dist/fretfire
          cp -r fretfire/dist/. dist/fretfire/

      - name: Build 92 Hard
        working-directory: 92hard
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm test
          npm run build
      - name: Add 92 Hard to the site
        run: |
          mkdir -p dist/92hard
          cp -r 92hard/dist/. dist/92hard/

      # enablement turns Pages on via the API if it isn't configured yet, so
      # there's no manual repository setting to find first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
