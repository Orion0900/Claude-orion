name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests
        run: npm test

  podbrief:
    name: PodBrief typecheck, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: podcast-summarizer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: podcast-summarizer/package-lock.json

      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests
        run: npm test

  easypedal:
    name: EasyPedal typecheck, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
